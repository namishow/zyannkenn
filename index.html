<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>じゃんけんバトル！〜最強を目指せ〜</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for BGM and Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap');
        
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 揺れるアニメーション */
        @keyframes shake {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(10px) rotate(5deg); }
        }

        /* ポップインアニメーション */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-shake {
            animation: shake 0.2s infinite;
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* カスタムグラデーション背景 */
        .bg-pattern {
            background-color: #4158D0;
            background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
        }

        /* ボタンの押し心地立体エフェクト */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0px 6px 0px rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex items-center justify-center p-4 text-slate-800">

    <!-- メインカードコンテナ -->
    <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl border-4 border-white flex flex-col items-center justify-between min-h-[620px] relative overflow-hidden">
        
        <!-- ヘッダーエリア（スコア・サウンドコントロール） -->
        <div class="w-full flex justify-between items-center mb-2 z-10">
            <div class="flex items-center space-x-2 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-100">
                <i class="fa-solid fa-trophy text-amber-500 text-lg"></i>
                <span class="text-xs font-bold text-indigo-900">連勝: <span id="current-streak" class="text-base text-indigo-600 font-extrabold">0</span></span>
                <span class="text-xs text-slate-400">|</span>
                <span class="text-xs font-bold text-slate-500">最高: <span id="max-streak" class="text-slate-700 font-extrabold">0</span></span>
            </div>

            <!-- BGM トグルボタン -->
            <button id="bgm-toggle" class="flex items-center space-x-1 bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full text-xs font-bold transition border border-slate-300">
                <i id="bgm-icon" class="fa-solid fa-volume-xmark text-red-500"></i>
                <span id="bgm-status">BGM OFF</span>
            </button>
        </div>

        <!-- アニメーション表示用サブタイトル -->
        <div class="text-center my-2">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 tracking-wider">
                じゃんけん BATTLE!
            </h1>
            <p id="game-status" class="text-sm font-bold text-slate-500 h-6">勝負する手を選んでね！</p>
        </div>

        <!-- 相手（CPU）エリア -->
        <div class="flex flex-col items-center my-2">
            <div id="cpu-avatar" class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center text-4xl mb-2 border-4 border-amber-300 shadow-inner transition-transform">
                🤖
            </div>
            <!-- CPUの手表示カード -->
            <div id="cpu-hand-card" class="w-28 h-28 bg-gradient-to-br from-slate-100 to-slate-200 rounded-2xl flex items-center justify-center border-4 border-slate-300 shadow-md">
                <span id="cpu-hand-icon" class="text-6xl">❓</span>
            </div>
            <span class="text-xs font-bold text-slate-400 mt-1">相手の手</span>
        </div>

        <!-- VS表示・結果メッセージ -->
        <div class="h-12 flex items-center justify-center my-1">
            <div id="result-message" class="text-2xl font-black text-center px-4 py-1 rounded-xl transition-all">
                <span class="text-slate-300 font-extrabold tracking-widest">VS</span>
            </div>
        </div>

        <!-- 自分の手表示＆選択エリア -->
        <div class="w-full flex flex-col items-center">
            <span class="text-xs font-bold text-slate-400 mb-2">自分の手を選ぶ</span>
            <div class="grid grid-cols-3 gap-3 w-full">
                <!-- グーボタン -->
                <button onclick="play('rock')" class="btn-3d bg-rose-500 hover:bg-rose-600 text-white p-4 rounded-2xl flex flex-col items-center justify-center border-b-4 border-rose-700 active:border-b-0 focus:outline-none">
                    <span class="text-4xl mb-1">✊</span>
                    <span class="text-xs font-black">グー</span>
                </button>

                <!-- チョキボタン -->
                <button onclick="play('scissors')" class="btn-3d bg-amber-500 hover:bg-amber-600 text-white p-4 rounded-2xl flex flex-col items-center justify-center border-b-4 border-amber-700 active:border-b-0 focus:outline-none">
                    <span class="text-4xl mb-1">✌️</span>
                    <span class="text-xs font-black">チョキ</span>
                </button>

                <!-- パーボタン -->
                <button onclick="play('paper')" class="btn-3d bg-emerald-500 hover:bg-emerald-600 text-white p-4 rounded-2xl flex flex-col items-center justify-center border-b-4 border-emerald-700 active:border-b-0 focus:outline-none">
                    <span class="text-4xl mb-1">✋</span>
                    <span class="text-xs font-black">パー</span>
                </button>
            </div>
        </div>

        <!-- リセット・やり直しボタン -->
        <div class="w-full flex justify-end mt-4">
            <button onclick="resetGame()" class="text-xs text-slate-400 hover:text-slate-600 flex items-center space-x-1 underline">
                <i class="fa-solid fa-rotate-left"></i>
                <span>スコアリセット</span>
            </button>
        </div>

    </div>

    <script>
        // --- ゲーム状態変数 ---
        let currentStreak = 0;
        let maxStreak = 0;
        let isPlayingAnimation = false;
        let bgmPlaying = false;

        // 手の定義
        const hands = {
            rock: { name: 'グー', icon: '✊' },
            scissors: { name: 'チョキ', icon: '✌️' },
            paper: { name: 'パー', icon: '✋' }
        };

        // DOM要素
        const cpuHandIcon = document.getElementById('cpu-hand-icon');
        const cpuHandCard = document.getElementById('cpu-hand-card');
        const cpuAvatar = document.getElementById('cpu-avatar');
        const resultMessage = document.getElementById('result-message');
        const gameStatus = document.getElementById('game-status');
        const currentStreakEl = document.getElementById('current-streak');
        const maxStreakEl = document.getElementById('max-streak');
        const bgmToggleBtn = document.getElementById('bgm-toggle');
        const bgmIcon = document.getElementById('bgm-icon');
        const bgmStatus = document.getElementById('bgm-status');

        // --- Tone.js によるサウンドエンジンの構築 ---
        let synth, bgmLoop, winSynth, loseSynth;
        let soundInitialized = false;

        function initAudio() {
            if (soundInitialized) return;

            // ボタン音/効果音用のシンプルなシンセ
            synth = new Tone.Synth({
                oscillator: { type: "triangle" },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();

            // 勝利ファンファーレ用シンセ
            winSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "square" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.2 }
            }).toDestination();
            winSynth.volume.value = -6;

            // 敗北用シンセ
            loseSynth = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 0.3 }
            }).toDestination();
            loseSynth.volume.value = -4;

            // レトロ風ポップBGMのループ作成 (ファミコン風ポップチューン)
            const bgmSynth = new Tone.Synth({
                oscillator: { type: "pulse", width: 0.25 },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.3, release: 0.1 }
            }).toDestination();
            bgmSynth.volume.value = -16; // BGMは控えめの音量

            const bassSynth = new Tone.MembraneSynth().toDestination();
            bassSynth.volume.value = -12;

            // BGMのメロディライン
            const melody = [
                { time: "0:0", note: "C5", duration: "8n" },
                { time: "0:0:2", note: "E5", duration: "8n" },
                { time: "0:1:0", note: "G5", duration: "8n" },
                { time: "0:1:2", note: "C6", duration: "8n" },
                { time: "0:2:0", note: "A5", duration: "8n" },
                { time: "0:2:2", note: "F5", duration: "8n" },
                { time: "0:3:0", note: "G5", duration: "4n" },

                { time: "1:0", note: "F5", duration: "8n" },
                { time: "1:0:2", note: "D5", duration: "8n" },
                { time: "1:1:0", note: "E5", duration: "8n" },
                { time: "1:1:2", note: "C5", duration: "8n" },
                { time: "1:2:0", note: "D5", duration: "8n" },
                { time: "1:2:2", note: "G4", duration: "8n" },
                { time: "1:3:0", note: "C5", duration: "4n" }
            ];

            // Tone.Part でメロディ作成
            const melodyPart = new Tone.Part((time, value) => {
                bgmSynth.triggerAttackRelease(value.note, value.duration, time);
            }, melody);
            melodyPart.loop = true;
            melodyPart.loopEnd = "2m";

            // ベースドラムループ
            const bassPart = new Tone.Loop((time) => {
                bassSynth.triggerAttackRelease("C2", "8n", time);
            }, "4n");

            Tone.Transport.bpm.value = 135;
            melodyPart.start(0);
            bassPart.start(0);

            soundInitialized = true;
        }

        // BGM 切り替え
        bgmToggleBtn.addEventListener('click', async () => {
            await Tone.start();
            initAudio();

            if (!bgmPlaying) {
                Tone.Transport.start();
                bgmPlaying = true;
                bgmIcon.className = "fa-solid fa-volume-high text-emerald-500";
                bgmStatus.innerText = "BGM ON";
            } else {
                Tone.Transport.stop();
                bgmPlaying = false;
                bgmIcon.className = "fa-solid fa-volume-xmark text-red-500";
                bgmStatus.innerText = "BGM OFF";
            }
        });

        // 効果音再生用ヘルパー
        function playSound(type) {
            if (!soundInitialized) return;
            
            const now = Tone.now();
            if (type === 'click') {
                synth.triggerAttackRelease("C5", "16n", now);
            } else if (type === 'draw') {
                synth.triggerAttackRelease("G4", "8n", now);
                synth.triggerAttackRelease("G4", "8n", now + 0.15);
            } else if (type === 'win') {
                winSynth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                winSynth.triggerAttackRelease(["C6"], "4n", now + 0.2);
            } else if (type === 'lose') {
                loseSynth.triggerAttackRelease("G3", "8n", now);
                loseSynth.triggerAttackRelease("E3", "8n", now + 0.15);
                loseSynth.triggerAttackRelease("C3", "4n", now + 0.3);
            }
        }

        // --- メインゲームロジック ---
        async function play(playerChoice) {
            if (isPlayingAnimation) return;
            
            // 最初の操作でオーディオコンテキスト起動準備
            await Tone.start();
            initAudio();

            isPlayingAnimation = true;
            playSound('click');

            // 状態のリセット＆シャッフル準備
            gameStatus.innerText = "じゃん・けん・ぽん！";
            resultMessage.innerHTML = '<span class="text-slate-300 font-extrabold tracking-widest">VS</span>';
            resultMessage.className = "text-2xl font-black text-center px-4 py-1 rounded-xl transition-all";
            cpuAvatar.innerText = "🤖";
            
            // 相手の手をシャッフル（シャッフルアニメーション）
            cpuHandCard.classList.add('animate-shake');
            const handKeys = Object.keys(hands);
            let shuffleCount = 0;
            
            const shuffleInterval = setInterval(() => {
                const randomHand = handKeys[Math.floor(Math.random() * handKeys.length)];
                cpuHandIcon.innerText = hands[randomHand].icon;
                shuffleCount++;
            }, 80);

            // 1秒後に結果決定
            setTimeout(() => {
                clearInterval(shuffleInterval);
                cpuHandCard.classList.remove('animate-shake');

                // CPUの手を確定
                const cpuChoice = handKeys[Math.floor(Math.random() * handKeys.length)];
                cpuHandIcon.innerText = hands[cpuChoice].icon;
                
                // 勝敗判定
                determineWinner(playerChoice, cpuChoice);
                
                isPlayingAnimation = false;
            }, 900);
        }

        // 勝敗判定
        function determineWinner(player, cpu) {
            if (player === cpu) {
                // 引き分け
                resultMessage.innerText = "あいこ！";
                resultMessage.className = "text-2xl font-black text-center px-6 py-1 rounded-xl bg-amber-100 text-amber-700 animate-pop border-2 border-amber-300";
                gameStatus.innerText = "もう一度勝負！";
                cpuAvatar.innerText = "😯";
                playSound('draw');
            } else if (
                (player === 'rock' && cpu === 'scissors') ||
                (player === 'scissors' && cpu === 'paper') ||
                (player === 'paper' && cpu === 'rock')
            ) {
                // 勝利
                resultMessage.innerText = "キミの勝ち！🎉";
                resultMessage.className = "text-2xl font-black text-center px-6 py-1 rounded-xl bg-emerald-500 text-white animate-pop border-2 border-emerald-600 shadow-lg";
                gameStatus.innerText = "ナイス！その調子！";
                cpuAvatar.innerText = "😭";
                
                // 連勝カウント更新
                currentStreak++;
                if (currentStreak > maxStreak) {
                    maxStreak = currentStreak;
                }
                updateScoreDisplay();
                playSound('win');
            } else {
                // 敗北
                resultMessage.innerText = "相手の勝ち…";
                resultMessage.className = "text-2xl font-black text-center px-6 py-1 rounded-xl bg-slate-700 text-white animate-pop border-2 border-slate-800";
                gameStatus.innerText = "ドンマイ！次は勝てる！";
                cpuAvatar.innerText = "😎";
                
                // 連勝リセット
                currentStreak = 0;
                updateScoreDisplay();
                playSound('lose');
            }
        }

        // スコア表示更新
        function updateScoreDisplay() {
            currentStreakEl.innerText = currentStreak;
            maxStreakEl.innerText = maxStreak;
            
            // 連勝時のポップ演出
            currentStreakEl.classList.add('animate-pop');
            setTimeout(() => currentStreakEl.classList.remove('animate-pop'), 300);
        }

        // ゲームリセット
        function resetGame() {
            currentStreak = 0;
            maxStreak = 0;
            updateScoreDisplay();
            resultMessage.innerHTML = '<span class="text-slate-300 font-extrabold tracking-widest">VS</span>';
            resultMessage.className = "text-2xl font-black text-center px-4 py-1 rounded-xl transition-all";
            cpuHandIcon.innerText = "❓";
            cpuAvatar.innerText = "🤖";
            gameStatus.innerText = "勝負する手を選んでね！";
            if (soundInitialized) playSound('click');
        }
    </script>
</body>
</html>
